<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOOP WHO ARE YA? — 숲 스트리머 스무고개</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <audio id="bgmAudio" src="bgm.mp3" loop preload="auto"></audio>
  <div class="app">

    <!-- ================= 메인 화면 ================= -->
    <section id="homeScreen" class="screen">
      <header class="app-header">
        <h1>SOOP <span class="accent">WHO ARE YA?</span></h1>
        <p class="subtitle">힌트를 보고 숲(SOOP) 스트리머를 맞혀보세요!</p>
      </header>

      <div class="home-menu">
        <button id="startGameBtn" class="home-btn primary">🎮 게임 시작</button>
        <button id="tutorialBtn" class="home-btn">📘 튜토리얼</button>
        <button id="statsBtn" class="home-btn">📊 통계</button>
        <button id="settingsBtn" class="home-btn">⚙️ 설정</button>

        <div id="settingsPopover" class="settings-popover hidden">
          <span id="homeVolumeIcon">🔊</span>
          <span class="settings-label">음량</span>
          <input type="range" id="homeVolumeSlider" min="0" max="100" value="70" />
        </div>
      </div>

      <div class="footer-box">
        <p>각종 문제 오류, 문의, 스트리머 사진 및 아이디어 제공 환영</p>
        <p>제작자 이메일: <a href="mailto:konamp63@gmail.com">konamp63@gmail.com</a></p>
      </div>
    </section>

    <!-- ================= 통계 화면 ================= -->
    <section id="statsScreen" class="screen hidden">
      <div class="game-topbar">
        <button id="statsHomeBtn" class="icon-btn" title="메인으로">🏠</button>
        <h2 class="screen-title">📊 통계</h2>
        <span class="topbar-spacer"></span>
      </div>

      <div class="stats-summary">
        <div class="stat-card">
          <span class="stat-value" id="statTotalWins">0</span>
          <span class="stat-label">맞힌 횟수</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statAverage">-</span>
          <span class="stat-label">평균 시도 횟수</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statBest">-</span>
          <span class="stat-label">최소 시도 횟수</span>
        </div>
      </div>

      <div class="stats-chart-wrap">
        <p class="stats-chart-caption">시도 횟수별 정답 분포</p>
        <div class="stats-chart" id="statsChart"></div>
      </div>

      <div id="statsEmpty" class="status hidden">아직 맞힌 기록이 없어요. 게임을 플레이해보세요!</div>

      <button id="resetStatsBtn" class="text-btn">통계 초기화</button>
    </section>

    <!-- ================= 게임 화면 (게임 시작 / 튜토리얼 공용) ================= -->
    <section id="gameScreen" class="screen hidden">
      <div class="game-topbar">
        <button id="homeBtn" class="icon-btn" title="메인으로">🏠</button>
        <h2 class="screen-title hidden" id="tutorialTitle">📘 튜토리얼</h2>
        <span class="topbar-spacer"></span>
        <div class="sound-control">
          <button id="soundBtn" class="icon-btn" title="사운드">🔊</button>
          <div id="volumePopover" class="volume-popover hidden">
            <span id="volumeIcon">🔊</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="70" />
          </div>
        </div>
      </div>

      <div id="tutorialBanner" class="tutorial-banner hidden">
        <p id="tutorialText"></p>
        <div class="tutorial-actions">
          <button id="tutorialNextBtn" class="ghost-btn">다음 →</button>
          <button id="tutorialSkipBtn" class="text-btn">튜토리얼 종료</button>
        </div>
      </div>

      <div id="loading" class="status">스트리머 데이터를 불러오는 중...</div>

      <main id="game" class="hidden">
        <div class="reveal-card">
          <div class="reveal-photo" id="revealPhoto">
            <span class="reveal-mark">?</span>
          </div>
          <div id="revealName" class="reveal-name hidden"></div>
        </div>

        <div class="guess-box" id="guessBox">
          <div class="input-row">
            <input id="guessInput" type="text" placeholder="스트리머 이름을 입력하세요" autocomplete="off" />
            <button id="submitBtn">맞히기</button>
          </div>
          <ul id="suggestions" class="suggestions hidden"></ul>
        </div>

        <div class="result-panel hidden" id="resultPanel">
          <p id="resultText"></p>
          <div class="result-actions">
            <button id="playAgainBtn">🔀 다른 문제 도전하기</button>
            <a id="stationLinkBtn" class="station-link-btn hidden" href="#" target="_blank" rel="noopener noreferrer">📺 방송국 가기</a>
          </div>
        </div>

        <div class="toolbar">
          <span id="guessCount">시도: 0회</span>
          <button id="shuffleBtn" class="ghost-btn" title="다른 스트리머로 새 게임 시작">🔀 다른 문제</button>
          <button id="giveupBtn" class="ghost-btn">🏳️ 정답 보기</button>
        </div>

        <div class="board-wrap">
          <div class="board" id="board">
            <div class="board-row board-head">
              <div class="cell cell-name">스트리머</div>
              <div class="cell">성별</div>
              <div class="cell">소속 크루</div>
              <div class="cell">나이</div>
              <div class="cell">애청자 수</div>
            </div>
            <div id="boardBody"></div>
          </div>
        </div>
      </main>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
